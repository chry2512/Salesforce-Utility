<template>
    <lightning-card>
        <button class="cache-reset" onclick={resetCache}>Reset</button>
        <img if:true={firstStep} src={iniziareCliccaStart} class="img-dimensions" alt="" />
        <img if:true={secondStep} src={estrazioneRecordStaging} class="img-dimensions" alt="" />
        <img if:true={thirdStep} src={caricaFileElaborazione} class="img-dimensions" alt="" />
        <img if:true={forthStep} src={AvvioProcessoHeader} class="img-dimensions" alt="" />
        <img if:true={fifthStep} src={AvvioProcessoHeader} class="img-dimensions" alt="">
        <img if:true={sixthStep} src={AvvioProcessoHeader} class="img-dimensions" alt="">
        
        <!--Testo secondo step-->
        <div if:true={secondStepNoBar} class="container-presentation distance-secondStep">
            <i class="fa fa-chevron-right icon-feature"></i>
            <h2 class="third-page-title">{label.TitleProcessoEstrazione}:</h2>
        </div>
        <div if:true={secondStepNoBar} class="container txt-secondoStep">
            <h4>{label.DescriptionSecondStep}</h4>
            <h4 style="margin-top: 5px;margin-bottom:20px;">{label.Descrizione_Secondo_Step2}:</h4>
        </div>
        <!--Testo durante barra di caricamento quarto step-->
        <div if:true={barProgress} class="container-presentation distance-secondStep">
            <i class="fa fa-chevron-right icon-feature"></i>
            <h4 style="display: inline;" class="third-page-title">{label.delayTitle}</h4>
        </div>
        <div if:true={barProgress} class="container txt-secondoStep">
            <h4 style="margin-top: 2%; display: inline;">{label.delayMessage}</h4>
        </div>
        <!--terzo step, per l'upload del file-->
        <div if:true={thirdStep} class="slds-p-around_medium lgc-bg third-input">
            <c-uploader-service third-step={thirdStep} onuploadevent={uploadEvent}></c-uploader-service>
        </div> 
        <!--quinto step-->
        <div if:true={fifthStep} >
            <c-price-management></c-price-management>
        </div> 
        <!--secondo step, per i toggle button-->
        <div if:true={secondStepNoBar} class="slds-form-element distance-firstToggle">
            <label class="slds-checkbox_toggle slds-grid">
                <span class="slds-form-element__label slds-m-bottom_none">{label.Download_File}</span>
                <input type="checkbox" name="checkbox-toggle-15" value="checkbox-toggle-15" aria-describedby="checkbox-toggle-15" onclick={downloadFileToggle} checked={file} />
                <span id="checkbox-toggle-151" class="slds-checkbox_faux_container" aria-live="assertive">
                    <span class="slds-checkbox_faux"></span>
                    <span class="slds-checkbox_on">{label.Enabled}</span>
                    <span class="slds-checkbox_off">{label.Disabled}</span>
                </span>
            </label>
        </div>
        <br />
        <div if:true={secondStepNoBar} class="slds-form-element distance-secondToggle">
            <label class="slds-checkbox_toggle slds-grid">
                <span class="slds-form-element__label slds-m-bottom_none" style="margin-left: 19px;">{label.Send_Email}</span>
                <span></span>
                <input type="checkbox" name="checkbox-toggle-15" value="checkbox-toggle-15" aria-describedby="checkbox-toggle-15" onclick={sendEmailToggle} checked={send} />
                <span id="checkbox-toggle-152" class="slds-checkbox_faux_container" aria-live="assertive">
                    <span class="slds-checkbox_faux"></span>
                    <span class="slds-checkbox_on">{label.Enabled}</span>
                    <span class="slds-checkbox_off">{label.Disabled}</span>
                </span>
            </label>
        </div>
        <br />
         <template lwc:if={secondStepWithBar}>
            <c-extraction-service ontogglechange={afterExtraction} file={file} send={send}></c-extraction-service>
        </template> 
        <template lwc:if={downloadSuccess}>
            <div class="download-message-container slds-align_absolute-center">
                <div class="slds-grid slds-grid_vertical slds-p-around_small">
                    <div class="download-message slds-col slds-align-middle">
                        <p>{label.Grazie}</p>
                    </div>
                    <div class="download-message slds-col slds-align-middle slds-p-around_small">
                        <p>{label.Processo}</p>
                    </div>
                    <div class="slds-col slds-align-middle slds-p-around_small">
                        <lightning-icon class="success-message-icon" icon-name="action:approval"></lightning-icon>
                    </div>
                </div>
            </div>
        </template>
        <div style="color:red; margin: 12px;" class=" slds-align_absolute-center demo-only demo-only--sizing slds-grid slds-wrap">
            <template if:true={downloadError}>
                <c-error-panel errors={errorMessage}></c-error-panel>
            </template>
        </div>
        <!-- <template if:true={forthStep}>
            <c-amp_-start-service-creation onbarcompleted={barCompletition}></c-amp_-start-service-creation>
        </template> -->
        <template lwc:if={forthStepSuccess}>
            <div class="download-message-container slds-align_absolute-center">
                <div class="slds-grid slds-grid_vertical slds-p-around_small">
                    <div class="download-message slds-col slds-align-middle">
                        <p>{label.Grazie}</p>
                    </div>
                    <div class="download-message slds-col slds-align-middle slds-p-around_small">
                        <p>{label.Processo}</p>
                    </div>
                    <div class="slds-col slds-align-middle slds-p-around_small">
                        <lightning-icon class="success-message-icon" icon-name="action:approval"></lightning-icon>
                    </div>
                </div>
            </div>
        </template>
        <div style="color:red; margin: 12px;" class=" slds-align_absolute-center demo-only demo-only--sizing slds-grid slds-wrap">
            <template if:true={onError}>
                <c-error-panel errors={errorMessage}></c-error-panel> 
            </template>
        </div>

            <div class="container-presentation-sixthStep distance-sixthStep">
                <i class="fa fa-chevron-right icon-feature"></i>

            <div if:false={downloadOperable}>

        <div class="toggleFirstStep" if:true={firstStep}>
            <div>
                <label class="slds-checkbox_toggle containerToggle">
                    <span class="slds-form-element__label title-toggle-margin nowrap">Pricing Management</span>
                    <input type="checkbox" name="toggle-Pricing" value="toggle-Pricing" aria-describedby="toggle-Pricing" onclick={testToggles} checked={checkedFirst} />
                    <span id="checkbox-toggle-Pricing" class="slds-checkbox_faux_container" aria-live="assertive">
                        <span class="slds-checkbox_faux"></span>
                        <span class="slds-checkbox_on"></span>
                        <span class="slds-checkbox_off"></span>
                    </span>
                </label>
            </div>
            <div class="marginTopToggle">
                <label class="slds-checkbox_toggle containerToggle">
                    <span class="slds-form-element__label title-toggle-margin nowrap">Input File</span>
                    <input type="checkbox" name="toggle-Input" value="toggle-Input" aria-describedby="toggle-Input" onclick={testToggles} checked={checkedSecond} />
                    <span id="checkbox-toggle-InputFile" class="slds-checkbox_faux_container" aria-live="assertive">
                        <span class="slds-checkbox_faux"></span>
                        <span class="slds-checkbox_on"></span>
                        <span class="slds-checkbox_off"></span>
                    </span>
                </label>
            </div>
            <div class="marginTopToggle">
                <label class="slds-checkbox_toggle containerToggle">
                    <span class="slds-form-element__label title-toggle-margin nowrap">Extract All Records</span>
                    <input type="checkbox" name="toggle-Extract" value="toggle-Extract" aria-describedby="toggle-Extract" onclick={testToggles} checked={checkedThird} />
                    <span id="checkbox-toggle-ExtractRecords" class="slds-checkbox_faux_container" aria-live="assertive">
                        <span class="slds-checkbox_faux"></span>
                        <span class="slds-checkbox_on"></span>
                        <span class="slds-checkbox_off"></span>
                    </span>
                </label>
            </div>
            <br />
        </div>
        <!--Bottone Start primo Step-->
        <div if:true={toggleActiveTest}>
            <button if:true={firstStep} class="slds-align_absolute-center slds-button slds-button_success first-button" onclick={start}>{label.AMP_Start}</button>
        </div>
        <div if:false={toggleActiveTest}>
            <button if:true={firstStep} class="slds-align_absolute-center slds-button slds-button_success first-button opacity">{label.AMP_Start}</button>
        </div>
        <div class="custom-container">
            <br />
            <!--Bottone Previous-->
            <div if:false={firstStep} class="buttonPrevious-style">
                <template lwc:if={previousToggle}>
                    <button class="slds-button slds-button_text-destructive" onclick={previousStep}>{label.Previous}</button>
                </template>
                <template lwc:else>
                    <button class="slds-button slds-button_text-destructive opacity">{label.Previous}</button>
                </template>
                <!--Bottone Next-->
            </div>
            <div if:false={firstStep} class="buttonNext-style">
                <template lwc:if={nextToggle}>
                    <button class="slds-button slds-button_destructive" onclick={nextStep}>{label.Next}</button>
                </template>
                <template lwc:else>
                    <button class="slds-button slds-button_destructive opacity">{label.Next}</button>
                </template>
            </div>
            <!--barra di progressione-->
            <lightning-progress-indicator current-step={current} class="custom-css" type="base" variant="base">
                <lightning-progress-step label="Step 1" value="1"></lightning-progress-step>
                <lightning-progress-step label="Step 2" value="2"></lightning-progress-step>
                <lightning-progress-step label="Step 3" value="3"></lightning-progress-step>
                <lightning-progress-step label="Step 4" value="4"></lightning-progress-step>
                <lightning-progress-step label="Step 5" value="5"></lightning-progress-step>
                <lightning-progress-step label="Step 6" value="6"></lightning-progress-step>
            </lightning-progress-indicator>
        </div>
    </lightning-card>
  </template>
