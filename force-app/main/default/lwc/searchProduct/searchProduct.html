    <template>
        <lightning-card title={label.cardTitle} class="product-search-icon" icon-name="standard:events">
            <lightning-button onclick={clearInput}  slot="actions" label={label.clearInput}></lightning-button>
            <div class="slds-grid slds-grid_vertical">
                <div class="slds-col slds-align-middle slds-size_1-of-3">
                    <lightning-layout>
                        <lightning-layout-item size="12">
                            <div class="slds-p-around_medium slds-text-align_center">
                            <c-looku-page  onselected={selectedRecord} onclearevent={clearEvent}></c-looku-page>
                            </div>
                        </lightning-layout-item>
                    </lightning-layout>
                </div>
                <div class="slds-col slds-align-middle slds-size_1-of-7">
                    <lightning-layout>
                        <lightning-layout-item size="12">
                            <div class="slds-p-around_medium slds-text-align_center">
                                <button onclick={searchClick} disabled={searchButtonDisabled} class="slds-button slds-button_destructive slds-button_stretch">{label.Search}</button>
                            </div>
                        </lightning-layout-item>
                    </lightning-layout>
                </div>
                
                <div class="slds-col slds-align-middle slds-m-around_medium">
                    <template lwc:if={productsFound}>
                        <lightning-datatable 
                        key-field="Id"
                        data={products}
                        columns={columns}
                        onsave={handleSave}
                        draft-values={draftValues}
                        hide-checkbox-column="true"
                        class="save-button">
                        </lightning-datatable>
                    </template>
                    <template lwc:else>
                        <h2>{errorText}</h2>
                    </template>
                </div>
            </div>
        </lightning-card>
    </template>
